[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "CPY001",
    "D100",
    "D104",
    "D203",
    "D213",
    "D413"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415", "D103", "INP001", "ANN20"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.pycodestyle]
max-line-length = 120